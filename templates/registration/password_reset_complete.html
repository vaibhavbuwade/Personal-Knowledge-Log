{% extends 'base.html' %}

{% block title %}Password Reset Complete - AI KnowledgeHub{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5 text-center">
                <div class="d-inline-flex p-3 rounded-circle bg-success-subtle text-success mb-3">
                    <i class="bi bi-check-circle-fill fs-2"></i>
                </div>
                <h3 class="fw-bold mb-2">Password Reset Successfully!</h3>
                <p class="text-muted small mb-4">
                    Your password has been changed. You can now use your new password to sign into your account.
                </p>
                <div class="d-grid gap-2">
                    <a href="{% url 'learning_logs:login' %}" class="btn btn-primary btn-lg fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In Now
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
